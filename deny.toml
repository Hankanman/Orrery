# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run locally:
#   cargo install cargo-deny --locked && cargo deny check
# CI runs all four checks (advisories, bans, licenses, sources). It starts
# permissive enough to pass today; every exception below says why, so it can be
# revisited rather than silently growing.

[graph]
# Orrery is Linux-only; don't judge the macOS/Windows/wasm halves of gpui's graph.
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Fail on vulnerabilities; unmaintained/unsound crates warn only for crates we
# depend on directly ("workspace"), since most transitive ones come from gpui /
# gpui-component and aren't ours to swap.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Advisories we knowingly accept. None today: each new one fails CI until its
# dependency is bumped, or it is listed here with a reason and a way out.
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licenses present in the graph today.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# No exceptions. Note: the full (all-targets) graph also has Zed's GPL-3.0-or-later
# `zlog` / `ztracing` crates, but only on non-Linux targets. If a gpui bump pulls
# them into the Linux graph this check fails, which is intended: GPL-3 code
# can't ship in an MIT-licensed binary without a licensing decision.
exceptions = []

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
# gpui's graph carries several duplicate majors (windows-*, hashbrown, …);
# warn, don't fail.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# gpui is not on crates.io: it and its forks come from Zed's org, and the
# component library from longbridge. Anything else must be added deliberately.
allow-git = ["https://github.com/longbridge/gpui-component"]

[sources.allow-org]
github = ["zed-industries"]

# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run locally:
#   cargo install cargo-deny --locked && cargo deny check
# CI runs all four checks (advisories, bans, licenses, sources). It starts
# permissive enough to pass today; every exception below says why, so it can be
# revisited rather than silently growing.

[graph]
# Orrery is Linux-only; don't judge the macOS/Windows/wasm halves of gpui's graph.
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Fail on vulnerabilities; unmaintained/unsound crates warn only for crates we
# depend on directly ("workspace"), since most transitive ones come from gpui /
# gpui-component and aren't ours to swap.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Known advisories in today's Cargo.lock, ignored so the gate can land and
# catch *new* ones. Each needs a dependency bump in its own PR, then remove
# its line here. Semver-compatible (a `cargo update -p <crate>` should do it):
ignore = [
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch 0.9.18 fmt::Pointer deref; fixed in >=0.9.20" },
    { id = "RUSTSEC-2026-0418", reason = "libz-sys <=1.1.30 build script prints the env into target/ (CI caches it); fixed in >=1.1.31" },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.40 TLS 1.3 encryption-level check; bump rustls" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.40 session-value Debug leaks secrets; fixed in >=0.23.46" },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.40 brotli cert decompression (non-default feature); bump rustls" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.40 ServerHello key-exchange downgrade; bump rustls" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.103.13 distrusted intermediates; fixed in >=0.103.16" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 1.0.7 distrusted emSign roots; fixed in >=1.0.10" },
    { id = "RUSTSEC-2026-0386", reason = "tokio 1.52.3 AsyncFd I/O safety (unsound); fixed in >=1.53.3" },
    # Need a semver-major bump (git2 0.20 → 0.21 is ours; quick-xml is via gpui):
    { id = "RUSTSEC-2026-0183", reason = "git2 0.20 Remote::list() UB (unsound); fixed in git2 >=0.21" },
    { id = "RUSTSEC-2026-0184", reason = "git2 0.20 blame_buffer Signature UB (unsound); we don't use blame_buffer; fixed in >=0.21" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 quadratic duplicate-attr check; build-time only (wayland-scanner proc-macro on trusted protocol XML)" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 NsReader unbounded alloc; build-time only (wayland-scanner proc-macro)" },
]

[licenses]
confidence-threshold = 0.9
# Permissive licenses present in the graph today.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# No exceptions. Note: the full (all-targets) graph also has Zed's GPL-3.0-or-later
# `zlog` / `ztracing` crates, but only on non-Linux targets. If a gpui bump pulls
# them into the Linux graph this check fails, which is intended: GPL-3 code
# can't ship in an MIT-licensed binary without a licensing decision.
exceptions = []

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
# gpui's graph carries several duplicate majors (windows-*, hashbrown, …);
# warn, don't fail.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# gpui is not on crates.io: it and its forks come from Zed's org, and the
# component library from longbridge. Anything else must be added deliberately.
allow-git = ["https://github.com/longbridge/gpui-component"]

[sources.allow-org]
github = ["zed-industries"]

name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and uploads the packages as a workflow artifact but
  # publishes nothing (there's no tag to release).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Don't ship from a commit that fails the suite, even if the tag was pushed by
  # hand.
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfontconfig1-dev libssl-dev \
            build-essential cmake pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Test
        run: cargo test --workspace --locked

  # The same packaging workflow CI dry-runs on every PR. On a tag it also fails
  # unless the tag matches the workspace crate version.
  package:
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      retention-days: 14

  publish:
    name: Publish draft release
    needs: [test, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          body: |
            Linux builds of Orrery (native GPUI). See the
            [documentation](https://hankanman.github.io/Orrery/) for setup.

            - `.deb` — Debian/Ubuntu
            - `.rpm` — Fedora
            - `.AppImage` — portable (any distro); the only build that bundles the llama.cpp engine
            - `SHA256SUMS` — verify a download with `sha256sum -c SHA256SUMS --ignore-missing`

            > Early development — expect rough edges. Built from the source at this tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + build + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI renders with Vulkan (blade) and talks Wayland/X11 directly, so the
      # build needs the Vulkan/Wayland/xkbcommon/fontconfig headers — not the old
      # WebKitGTK stack.
      - name: Install GPUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfontconfig1-dev libssl-dev \
            build-essential cmake pkg-config

      # Pinned (matches rust-toolchain.toml) so a newer clippy can't fail CI on
      # untouched code with new lints. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # --locked everywhere: CI must build exactly what Cargo.lock pins, and fail
      # if a manifest change wasn't reflected in the lockfile.
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # Dependency policy: RustSec advisories, licenses, banned crates, and allowed
  # sources (see deny.toml for the policy and its documented exceptions).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Not the action's default --all-features: deny.toml's [graph] decides.
          arguments: --locked
          command: check
          command-arguments: advisories bans licenses sources

  # Packaging dry run: the exact workflow release.yml runs on a tag (release
  # build, .deb, .rpm, llama runtime, AppImage, SHA256SUMS), minus publishing.
  packaging:
    name: Packaging dry run
    uses: ./.github/workflows/package.yml
